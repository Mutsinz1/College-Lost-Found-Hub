# Server block for the production stack (mounted at conf.d/default.conf).
# The React build is served directly; /api and /uploads go to the Go service.

upstream api_backend {
    server api:8080;
}

server {
    listen 80;
    server_name _;

    # Post images can be several MB each, and a post may carry five.
    client_max_body_size 32m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # NOTE: an add_header in any location block discards the ones inherited
    # from here. Caching below is therefore expressed with `expires`, which
    # sets Cache-Control without resetting inherited headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://api_backend/health;
        access_log off;
    }

    # Uploaded images are served straight from the shared volume. Only serve
    # image types: never execute or hand back anything else from this path.
    location /uploads/ {
        alias /var/www/uploads/;
        expires 7d;

        location ~* \.(jpg|jpeg|png|gif)$ {
            try_files $uri =404;
        }
        location ~ /uploads/.* {
            return 404;
        }
    }

    # Single-page app: hashed assets cache forever, index.html never does.
    location /static/ {
        root /usr/share/nginx/html;
        expires 1y;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
