version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: lostfound_postgres
    environment:
      POSTGRES_DB: lostfound
      POSTGRES_USER: lostfound_user
      POSTGRES_PASSWORD: lostfound_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - lostfound_network

  redis:
    image: redis:7-alpine
    container_name: lostfound_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lostfound_network

  nginx:
    image: nginx:alpine
    container_name: lostfound_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./uploads:/var/www/uploads
    depends_on:
      - postgres
      - redis
    networks:
      - lostfound_network

volumes:
  postgres_data:
  redis_data:

networks:
  lostfound_network:
    driver: bridge 