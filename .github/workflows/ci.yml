name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: lostfound_user
          POSTGRES_PASSWORD: lostfound_password
          POSTGRES_DB: lostfound
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lostfound_user -d lostfound"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://lostfound_user:lostfound_password@localhost:5432/lostfound?sslmode=disable
      TEST_DATABASE_URL: postgres://lostfound_user:lostfound_password@localhost:5432/lostfound?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run 'gofmt -w .' to fix."
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Run migrations
        run: go run cmd/migrate/main.go

      - name: Test
        run: go test -v ./...

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --watchAll=false

      - name: Build
        run: npm run build
        env:
          CI: "false" # CRA treats warnings as errors when CI=true

  # The Dockerfiles are the deployment path and nothing else exercises them.
  # A stale base image or a go.mod bump breaks the build silently otherwise --
  # exactly how golang:1.21 survived after the module moved to go 1.25.
  docker:
    name: Docker images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t lostfound-api:ci .

      - name: Build frontend image
        run: docker build -t lostfound-web:ci ./frontend

      - name: Binaries run in the built image
        run: |
          docker run --rm lostfound-api:ci server --help 2>&1 | head -1 || true
          docker run --rm --entrypoint admin lostfound-api:ci -h 2>&1 | head -3 || true

      - name: Compose file is valid
        env:
          POSTGRES_PASSWORD: ci
          JWT_SECRET: ci
          GOOGLE_CLIENT_ID: ci
        run: docker compose -f docker-compose.prod.yml config >/dev/null
